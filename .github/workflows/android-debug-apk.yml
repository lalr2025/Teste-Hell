name: Build Android Debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - work
  pull_request:

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

      - name: Setup Gradle 8.14.3
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.14.3
          cache-disabled: true

      - name: Show Gradle version
        run: gradle --version

      - name: Validate tracked binary files
        run: |
          disallowed=$(git ls-files | grep -E "\.(jar|apk|jks|keystore)$" || true)
          if [ -n "$disallowed" ]; then
            echo "Arquivos binários rastreados detectados:"
            echo "$disallowed"
            exit 1
          fi

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-diagnostics
          path: |
            **/build/reports/**
            **/build/tmp/**
